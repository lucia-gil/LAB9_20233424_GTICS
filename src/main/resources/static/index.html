<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stf-Puzzle Simplified Version</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/puzzle.css">
</head>
<body>
<div class="container py-4 text-center">
    <h2 class="mb-3">Stf-Puzzle Simplified Version</h2>

    <!-- ========== Pantalla de configuración ========== -->
    <div id="pantallaInicio" class="card mx-auto p-3 d-none" style="max-width: 360px;">
        <img id="imgPreview" src="img/default.jpg" alt="Personaje" class="mx-auto mb-3 preview">

        <div class="d-flex gap-2 mb-2 align-items-center">
            <input type="color" id="colorTablero" class="form-control form-control-color" value="#ffffff"
                   title="Color del tablero">
            <input type="text" id="dimension" class="form-control" placeholder="3x3" autocomplete="off">
        </div>
        <div id="errorDimension" class="text-danger small mb-2 d-none"></div>

        <input type="file" id="inputImagen" accept=".jpg,image/jpeg" class="d-none">
        <button id="btnSeleccionar" class="btn btn-success">Seleccionar Personaje</button>
        <div id="errorImagen" class="text-danger small mt-2 d-none"></div>

        <button id="btnIniciar" class="btn btn-success mt-3 d-none">Iniciar el juego</button>
    </div>

    <!-- ========== Pantalla de juego ========== -->
    <div id="pantallaJuego" class="d-none">
        <div id="tablero" class="tablero mx-auto"></div>
        <h5 id="mensajeJuego" class="mt-3 fw-bold"></h5>
    </div>

    <div id="errorGeneral" class="alert alert-danger mt-3 d-none mx-auto" style="max-width: 420px;"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/puzzle.js"></script>
</body>
</html>
